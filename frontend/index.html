<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sketch Cam Uploader</title>
    <link rel="stylesheet" href="./css/styles.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""/>
     <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div>
          <h1>Walkability</h1>
          <div class="sub">Score your walk</div>
        </div>
        <div class="pill" title="upload loop status">
          <span id="statusDot" class="dot"></span>
          <span id="statusText">idle</span>
        </div>
      </header>

      <div class="grid">
        <div class="card">
          <div class="row" style="margin-bottom: 10px;">
            <div>
              <label for="endpoint">Upload endpoint</label><br />
              <input id="endpoint" type="text" value="http://localhost:8000/upload" />
            </div>
            <div>
              <label for="interval">Interval (ms)</label><br />
              <input id="interval" type="number" min="500" step="100" value="2000" />
            </div>
            <div>
              <label for="device">Camera</label><br />
              <select id="device"></select>
            </div>
            <div style="display:flex; gap:10px; align-items:flex-end;">
              <button id="startBtn" class="primary">Start</button>
              <button id="stopBtn" class="danger" disabled>Stop</button>
            </div>
          </div>

          <div class="view">
            <video id="video" playsinline autoplay muted></video>
          </div>
          <div class="caption">Live camera feed</div>
          <canvas id="canvas"></canvas>
        </div>

        <div class="card">
          <div class="view" style="margin-bottom: 10px;">
            <img id="resultImg" alt="latest server result" />
          </div>
          <div class="tiny" style="margin-bottom: 10px;">
            Real time analysis and score
          </div>
          <pre id="output">{}</pre>
          <div id="warn" class="warn" style="display:none; margin-top: 10px;"></div>
        </div>

        <div class="card map-card">
          <div class="row" style="justify-content: space-between; align-items:center;">
            <div class="tiny">Current location </div>
            <div style="display:inline-flex; gap:8px; align-items:center;">
              <span id="clickText" class="tiny" aria-live="polite"></span>
              <span id="locText" class="tiny" aria-live="polite"></span>
              <button id="locateBtn" type="button">Pause tracking</button>
            </div>
          </div>
          <div class="view map-view" style="margin-top: 10px;">
            <div id="map" aria-label="map"></div>
          </div>
        </div>

        <div class="card">
          <div class="row" style="justify-content: space-between;">
            <div>
              <div style="font-weight: 800; margin-bottom: 4px;">Completed walks</div>
              <div class="tiny">Select a walk to render its route.</div>
            </div>
            <div>
              <button id="walksBtn" type="button">Refresh</button>
              <div id="walksSummary" class="tiny" style="margin-top: 6px;" aria-live="polite"></div>
            </div>
          </div>

          <table id="walksTable" class="walks-table" style="margin-top: 12px;">
            <thead>
              <tr>
                <th>Walk</th>
                <th>Started</th>
                <th>Average score</th>
                <th>Frames</th>
              </tr>
            </thead>
            <tbody id="walksTableBody"></tbody>
          </table>
        </div>

        <div class="card">
          <div class="row" style="justify-content: space-between; margin-bottom: 10px;">
            <div>
              <div style="font-weight: 800; margin-bottom: 4px;">Selected walk route</div>
              <div id="routeSummary" class="tiny">No walk selected yet.</div>
            </div>
          </div>
          <div class="view map-view" style="margin-top: 0;">
            <div id="routeMap" aria-label="route map"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
