<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sketch Cam Uploader</title>
    <link rel="stylesheet" href="./css/styles.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""/>
     <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div>
          <h1>Sketch Cam Uploader</h1>
          <div class="sub">Captures a frame every 2s → POSTs to <code>/upload</code> → shows response + latest result.</div>
        </div>
        <div class="pill" title="upload loop status">
          <span id="statusDot" class="dot"></span>
          <span id="statusText">idle</span>
        </div>
      </header>

      <div class="grid">
        <div class="card">
          <div class="row" style="margin-bottom: 10px;">
            <div>
              <label for="endpoint">Upload endpoint</label><br />
              <input id="endpoint" type="text" value="http://localhost:8000/upload" />
            </div>
            <div>
              <label for="interval">Interval (ms)</label><br />
              <input id="interval" type="number" min="500" step="100" value="2000" />
            </div>
            <div>
              <label for="device">Camera</label><br />
              <select id="device"></select>
            </div>
            <div style="display:flex; gap:10px; align-items:flex-end;">
              <button id="startBtn" class="primary">Start</button>
              <button id="stopBtn" class="danger" disabled>Stop</button>
            </div>
          </div>

          <div class="view">
            <video id="video" playsinline autoplay muted></video>
          </div>
          <div class="caption">Live camera feed (used for captures).</div>
          <canvas id="canvas"></canvas>
        </div>

        <div class="card">
          <div class="view" style="margin-bottom: 10px;">
            <img id="resultImg" alt="latest server result" />
          </div>
          <div class="tiny" style="margin-bottom: 10px;">
            Latest annotated result (served from <code>/latest-result</code> if your backend supports it).
          </div>
          <pre id="output">{}</pre>
          <div id="warn" class="warn" style="display:none; margin-top: 10px;"></div>
        </div>

        <div class="card map-card">
          <div class="row" style="justify-content: space-between; align-items:center;">
            <div class="tiny">Map (uses OpenStreetMap tiles). Click to copy lat/lng.</div>
            <div style="display:inline-flex; gap:8px; align-items:center;">
              <span id="clickText" class="tiny" aria-live="polite"></span>
              <span id="locText" class="tiny" aria-live="polite"></span>
              <button id="locateBtn" type="button">Pause tracking</button>
            </div>
          </div>
          <div class="view map-view" style="margin-top: 10px;">
            <div id="map" aria-label="map"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
